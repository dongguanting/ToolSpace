[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "automation-pro-synthesis"
version = "0.1.0"
description = "Grounded task synthesis and replay verification in Automation environments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11,<3", "datasets>=3.6,<5", "openai>=2.0,<3", "httpx>=0.28,<1"]

[project.scripts]
automation-pro = "run_pipeline:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
packages = ["automation_environment", "tool_graph", "task_generation", "verification", "examples"]
exclude = ["automation_environment/vendor"]

[tool.hatch.build.targets.wheel.force-include]
"automation_environment/vendor/automationbench" = "automationbench"
"run_pipeline.py" = "run_pipeline.py"
"automation_environment/vendor/AUTOMATIONBENCH_LICENSE" = "automationbench/LICENSE"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["automation_environment/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
